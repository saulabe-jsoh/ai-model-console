<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI Complete Model Hub Chat</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --secondary-hover: #475569;
            --user-bubble: #2563eb;
            --ai-bubble: #f1f5f9;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 880px;
            height: 94vh;
            background-color: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* 상단 설정 영역 */
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title-bar h2 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .export-group {
            display: flex;
            gap: 6px;
        }

        .btn-export {
            padding: 6px 12px;
            background-color: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-export:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 12px;
        }

        @media (max-width: 720px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-group input, .input-group select {
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background-color: #fff;
            color: var(--text-dark);
        }

        .input-group select optgroup {
            font-weight: 700;
            color: #334155;
            background: #f1f5f9;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
        }

        .model-desc-badge {
            font-size: 0.82rem;
            color: #334155;
            background-color: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            line-height: 1.45;
        }

        /* 트랜스포머 전용 프리셋 바 */
        .transformer-preset-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0;
            white-space: nowrap;
        }

        .preset-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #4338ca;
            background-color: #e0e7ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 4px;
        }

        .btn-preset {
            padding: 4px 10px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.76rem;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-preset:hover {
            background-color: #e0e7ff;
            border-color: #818cf8;
            color: #3730a3;
        }

        /* 채팅 메시지 영역 */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.assistant {
            align-self: flex-start;
            align-items: flex-start;
        }

        .model-tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: #334155;
            background-color: #e2e8f0;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.55;
            font-size: 0.95rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-wrapper.user .bubble {
            background-color: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message-wrapper.assistant .bubble {
            background-color: var(--ai-bubble);
            color: var(--text-dark);
            border-bottom-left-radius: 2px;
        }

        /* 하단 입력 영역 */
        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background-color: #ffffff;
        }

        .chat-input-area textarea {
            flex: 1;
            resize: none;
            height: 48px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area textarea:focus {
            border-color: var(--primary);
        }

        .chat-input-area button {
            padding: 0 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: var(--primary-hover);
        }

        .chat-input-area button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 상단 설정 및 트랜스포머 프리셋 툴바 -->
    <div class="chat-header">
        <div class="header-title-bar">
            <h2>OpenAI Model Console</h2>
            <div class="export-group">
                <button class="btn-export" onclick="exportChat('txt')" title="대화 내용을 텍스트 파일로 저장">
                    📄 TXT 내보내기
                </button>
                <button class="btn-export" onclick="exportChat('json')" title="대화 히스토리를 JSON 파일로 저장">
                    💾 JSON 내보내기
                </button>
            </div>
        </div>

        <div class="config-grid">
            <div class="input-group">
                <label for="apiKeyInput">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-proj-..." />
            </div>

            <div class="input-group">
                <label for="modelSelect">사용할 모델 선택</label>
                <select id="modelSelect" onchange="updateModelDescription()">
                    <!-- Flagship Models -->
                    <optgroup label="✨ Flagship (GPT-5.6)">
                        <option value="gpt-5.6-sol" selected>GPT-5.6 Sol (최고 성능 플래그십 · $4/$20)</option>
                        <option value="gpt-5.6-terra">GPT-5.6 Terra (지능 & 비용 균형 · $2/$12)</option>
                        <option value="gpt-5.6-luna">GPT-5.6 Luna (고처리량 최저가 · $0.20/$1.20)</option>
                    </optgroup>

                    <!-- Specialized & Cyber -->
                    <optgroup label="🛡️ Security & Cyber (Daybreak)">
                        <option value="gpt-5.6-cyber">GPT-5.6 Cyber (취약점 연구/보안 검증)</option>
                        <option value="daybreak-red">Daybreak Red (공격 관점 보안 검증 전용)</option>
                        <option value="daybreak-blue">Daybreak Blue (방어 관점 보안 전용)</option>
                    </optgroup>

                    <!-- Reasoning Models -->
                    <optgroup label="🧠 Deep Reasoning (o-Series)">
                        <option value="o3-mini">o3-mini (차세대 초고속 추론 특화)</option>
                        <option value="o1">o1 (플래그십 심층 사고 추론)</option>
                    </optgroup>

                    <!-- General Multimodal -->
                    <optgroup label="⚡ General Purpose (GPT-4o)">
                        <option value="gpt-4o">GPT-4o (범용 고성능 멀티모달)</option>
                        <option value="gpt-4o-mini">GPT-4o mini (초경량 범용 모델)</option>
                    </optgroup>

                    <!-- Audio / Realtime / Speech -->
                    <optgroup label="🎙️ Realtime & Speech">
                        <option value="gpt-realtime-2.1">GPT-Realtime-2.1 (도구 연동 추론 음성 모델)</option>
                        <option value="gpt-realtime-2.1-mini">GPT-Realtime-2.1 Mini (경량 음성 추론 모델)</option>
                        <option value="gpt-realtime-translate">GPT-Realtime-Translate (실시간 동시통역)</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="model-desc-badge" id="modelDescription"></div>

        <!-- Transformer 맞춤형 요청 프리셋 바 -->
        <div class="transformer-preset-bar">
            <span class="preset-title">⚡ Transformer Presets</span>
            <button class="btn-preset" onclick="applyTransformerPreset('attention')">🔍 Self-Attention 계산 과정</button>
            <button class="btn-preset" onclick="applyTransformerPreset('pytorch')">💻 Multi-Head Attention (PyTorch)</button>
            <button class="btn-preset" onclick="applyTransformerPreset('positional')">📐 Positional Encoding 수식/원리</button>
            <button class="btn-preset" onclick="applyTransformerPreset('architecture')">🏗️ Encoder vs Decoder 비교</button>
        </div>
    </div>

    <!-- 대화 출력 창 -->
    <div class="chat-messages" id="chatMessages">
        <div class="message-wrapper assistant">
            <span class="model-tag">System</span>
            <div class="bubble">API Key를 입력하고 사용할 모델을 선택하세요. 상단의 'Transformer Presets' 버튼을 누르면 트랜스포머 아키텍처 및 메커니즘 관련 심층 질문이 즉시 입력창에 구성됩니다.</div>
        </div>
    </div>

    <!-- 텍스트 입력창 -->
    <div class="chat-input-area">
        <textarea id="userInput" placeholder="메시지를 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    const modelMeta = {
        "gpt-5.6-sol": {
            displayTag: "GPT-5.6 Sol (Flagship)",
            badge: "💎 <strong>GPT-5.6 Sol:</strong> 복합 추론, 코딩 및 전문 업무용 최고 성능 플래그십 | <strong>가격:</strong> $4.00 (In) / $20.00 (Out) / MTok | <strong>컨텍스트:</strong> 1.05M"
        },
        "gpt-5.6-terra": {
            displayTag: "GPT-5.6 Terra",
            badge: "⚖️ <strong>GPT-5.6 Terra:</strong> 높은 지능과 비용 효율성을 균형 있게 제공하는 범용 모델 | <strong>가격:</strong> $2.00 (In) / $12.00 (Out) / MTok | <strong>컨텍스트:</strong> 1.05M"
        },
        "gpt-5.6-luna": {
            displayTag: "GPT-5.6 Luna",
            badge: "⚡ <strong>GPT-5.6 Luna:</strong> 대규모 트래픽 및 비용 민감형 워크로드 최적화 모델 | <strong>가격:</strong> $0.20 (In) / $1.20 (Out) / MTok | <strong>컨텍스트:</strong> 1.05M"
        },
        "gpt-5.6-cyber": {
            displayTag: "GPT-5.6 Cyber",
            badge: "🛡️ <strong>GPT-5.6 Cyber:</strong> 공인된 보안 취약점 연구, 페네트레이션 테스트 및 보안 분석 특화 모델"
        },
        "daybreak-red": {
            displayTag: "Daybreak Red",
            badge: "🔴 <strong>Daybreak Red:</strong> 취약점 발굴 및 오펜시브 시큐리티 연구 전용 에일리어스 모델"
        },
        "daybreak-blue": {
            displayTag: "Daybreak Blue",
            badge: "🔵 <strong>Daybreak Blue:</strong> 방어적 사이버 보안 업무 및 시스템 방어 체계 분석 모델"
        },
        "o3-mini": {
            displayTag: "o3-mini",
            badge: "🧠 <strong>o3-mini:</strong> STEM, 수학, 알고리즘 코딩에 최적화된 저지연 고속 심층 추론 모델"
        },
        "o1": {
            displayTag: "OpenAI o1",
            badge: "🔬 <strong>OpenAI o1:</strong> 최고 수준의 과학, 수학, 논리 설계를 위한 심층 Chain-of-Thought 모델"
        },
        "gpt-4o": {
            displayTag: "GPT-4o",
            badge: "🌐 <strong>GPT-4o:</strong> 텍스트 및 시각 데이터를 고속 처리하는 다목적 범용 플래그십"
        },
        "gpt-4o-mini": {
            displayTag: "GPT-4o Mini",
            badge: "🚀 <strong>GPT-4o Mini:</strong> 빠르고 경제적인 일상 챗봇 및 단순 텍스트 처리 최적화 모델"
        },
        "gpt-realtime-2.1": {
            displayTag: "GPT-Realtime-2.1",
            badge: "🎙️ <strong>GPT-Realtime-2.1:</strong> 도구 사용 기능과 추론 능력이 통합된 음성/텍스트 실시간 처리 모델"
        },
        "gpt-realtime-2.1-mini": {
            displayTag: "GPT-Realtime-2.1 Mini",
            badge: "⚡ <strong>GPT-Realtime-2.1 Mini:</strong> 경량화된 실시간 음성 및 상호작용 추론 모델"
        },
        "gpt-realtime-translate": {
            displayTag: "GPT-Realtime-Translate",
            badge: "🌍 <strong>GPT-Realtime-Translate:</strong> 스트리밍 기반 실시간 음성-대-음성/텍스트 통번역 전용 모델"
        }
    };

    const exportableHistory = [];
    const conversationHistory = [];

    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const modelSelect = document.getElementById("modelSelect");
    const modelDescription = document.getElementById("modelDescription");
    const sendBtn = document.getElementById("sendBtn");

    function updateModelDescription() {
        const selected = modelSelect.value;
        const meta = modelMeta[selected] || { badge: `선택된 모델: ${selected}` };
        modelDescription.innerHTML = meta.badge;
    }
    updateModelDescription();

    // --- Transformer 전용 요청 프리셋 주입 함수 ---
    function applyTransformerPreset(type) {
        const presets = {
            attention: "Transformer 아키텍처의 Scaled Dot-Product Attention 계산 과정을 단계별(Query, Key, Value 벡터 곱셈, 스케일링, Softmax, 가중합)로 직관적인 수식 및 예시와 함께 상세히 설명해줘.",
            pytorch: "PyTorch를 사용하여 Multi-Head Attention 레이어를 밑바닥부터(From Scratch) 구현하는 파이썬 코드를 작성하고, 텐서 차원(Shape) 변화 과정을 주석으로 달아줘.",
            positional: "Transformer에서 Positional Encoding(Sinusoidal 및 RoPE)의 수식 구조와 왜 삼각함수 또는 회전 변환을 사용하여 위치 정보를 주입하는지 그 수학적 원리를 설명해줘.",
            architecture: "Transformer 기반 모델에서 Encoder-Only(예: BERT), Decoder-Only(예: GPT), Encoder-Decoder(예: T5) 구조의 차이점과 각각의 장단점 및 적합한 태스크를 비교 정리해줘."
        };

        if (presets[type]) {
            userInput.value = presets[type];
            userInput.focus();
            // 코딩 및 심층 추론에 알맞은 모델로 자동 포커싱 유도 (기본 모델이 아닐 경우)
            if (modelSelect.value === "gpt-4o-mini") {
                modelSelect.value = "gpt-5.6-sol";
                updateModelDescription();
            }
        }
    }

    userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function appendMessage(role, text, modelTag = null) {
        const wrapper = document.createElement("div");
        wrapper.classList.add("message-wrapper", role);

        if (modelTag) {
            const tag = document.createElement("span");
            tag.classList.add("model-tag");
            tag.textContent = modelTag;
            wrapper.appendChild(tag);
        }

        const bubble = document.createElement("div");
        bubble.classList.add("bubble");
        bubble.textContent = text;
        wrapper.appendChild(bubble);

        chatMessages.appendChild(wrapper);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        return bubble;
    }

    async function sendMessage() {
        const apiKey = apiKeyInput.value.trim();
        const messageText = userInput.value.trim();
        const selectedModel = modelSelect.value;
        const currentMeta = modelMeta[selectedModel] || { displayTag: selectedModel };

        if (!apiKey) {
            alert("OpenAI API Key를 입력해주세요.");
            apiKeyInput.focus();
            return;
        }

        if (!messageText) return;

        // 1. 유저 메시지 렌더링 및 히스토리 기록
        appendMessage("user", messageText);
        conversationHistory.push({ role: "user", content: messageText });
        exportableHistory.push({
            role: "User",
            model: null,
            content: messageText,
            timestamp: new Date().toLocaleString()
        });
        userInput.value = "";

        sendBtn.disabled = true;

        // 2. 답변 대기 표시
        const loadingBubble = appendMessage("assistant", "응답을 생성하고 있습니다...", currentMeta.displayTag);

        try {
            // 3. API 요청
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: selectedModel,
                    messages: conversationHistory
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || `HTTP ${response.status} 오류`);
            }

            const data = await response.json();
            const replyText = data.choices[0].message.content;

            // 4. 응답 갱신 및 히스토리 보관
            loadingBubble.textContent = replyText;
            conversationHistory.push({ role: "assistant", content: replyText });
            exportableHistory.push({
                role: "Assistant",
                model: currentMeta.displayTag,
                content: replyText,
                timestamp: new Date().toLocaleString()
            });

        } catch (error) {
            loadingBubble.textContent = `⚠️ 오류 발생: ${error.message}`;
            conversationHistory.pop();
            exportableHistory.pop();
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // --- 채팅 내용 파일 내보내기 ---
    function exportChat(format) {
        if (exportableHistory.length === 0) {
            alert("내보낼 대화 내용이 없습니다.");
            return;
        }

        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        const timeStr = now.toTimeString().slice(0, 8).replace(/:/g, "-");
        const filename = `chat-export-${dateStr}_${timeStr}.${format}`;

        let fileContent = "";
        let mimeType = "";

        if (format === "txt") {
            mimeType = "text/plain;charset=utf-8";
            fileContent = "========================================\n";
            fileContent += "        OpenAI Chat Export Log\n";
            fileContent += `  Export Date: ${now.toLocaleString()}\n`;
            fileContent += "========================================\n\n";

            exportableHistory.forEach((msg, idx) => {
                const sender = msg.role === "User" ? "[USER]" : `[AI Assistant - ${msg.model || "Unknown"}]`;
                fileContent += `[${idx + 1}] ${sender} (${msg.timestamp})\n`;
                fileContent += `${msg.content}\n`;
                fileContent += "--------------------------------------------------------\n\n";
            });
        } else if (format === "json") {
            mimeType = "application/json;charset=utf-8";
            fileContent = JSON.stringify({
                exportedAt: now.toISOString(),
                totalMessages: exportableHistory.length,
                messages: exportableHistory
            }, null, 2);
        }

        const blob = new Blob([fileContent], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
